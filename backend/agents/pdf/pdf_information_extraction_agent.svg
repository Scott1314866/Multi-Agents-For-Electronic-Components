<rect x="548" y="500" width="180" height="64" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
<text x="638.0" y="527" text-anchor="middle" class="node-title">human_review</text>
<text x="638.0" y="549" text-anchor="middle" class="node-sub">interrupt 暂停</text>
<rect x="787" y="500" width="180" height="64" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
<text x="877.0" y="527" text-anchor="middle" class="node-title">apply_review</text>
<text x="877.0" y="549" text-anchor="middle" class="node-sub">批准 / 修改 / 拒绝</text>
<rect x="1042" y="500" width="210" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
<text x="1147.0" y="527" text-anchor="middle" class="node-title">finalize_result</text>
<text x="1147.0" y="549" text-anchor="middle" class="node-sub">JSON + Markdown 输出</text>
<rect x="1042" y="620" width="210" height="60" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
<text x="1147.0" y="647" text-anchor="middle" class="node-title">结构化参数</text>
<text x="1147.0" y="669" text-anchor="middle" class="node-sub">原始值 · 公差 · 页码 · 置信度</text>
<rect x="230" y="500" width="190" height="64" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.8"/>

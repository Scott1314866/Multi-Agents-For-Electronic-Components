<text x="114.5" y="150" text-anchor="middle" class="node-title">PDF 图纸</text>
<text x="114.5" y="172" text-anchor="middle" class="node-sub">文本型或扫描型</text>
<rect x="230" y="123" width="160" height="68" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8"/>
<text x="310.0" y="150" text-anchor="middle" class="node-title">validate_pdf</text>
<text x="310.0" y="172" text-anchor="middle" class="node-sub">路径 / 签名校验</text>

<text x="325.0" y="549" text-anchor="middle" class="node-sub">统一错误结果</text>
<path d="M187 157 H230" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M390 157 H433" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M593 157 H636" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M796 157 H839" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M999 157 H1042" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M1147 191 V245 H653 V313" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M758 347 H807" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M1012 347 H1075" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M1147 390 V430 H638 V500" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<rect x="1063" y="404" width="54" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="1090" y="419" text-anchor="middle" class="label" fill="#ea580c">是</text>
<path d="M728 532 H787" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<path d="M967 532 H1042" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<path d="M1219 347 H1310 V532 H1252" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<rect x="1225" y="310" width="32" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="1241" y="326" text-anchor="middle" class="label" fill="#2563eb">否</text>
<path d="M1147 564 V620" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M310 191 V230 H20 V532 H230" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-red)"/>
<rect x="30" y="448" width="118" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="89" y="463" text-anchor="middle" class="label" fill="#dc2626">文件 / 依赖失败</text>
<rect x="44" y="286" width="450" height="108" rx="10" fill="#f8fafc" stroke="#d1d5db"/>
<text x="64" y="315" class="node-title">高质量参数的关键</text>
<text x="64" y="342" class="node-sub">raw_value 保留 Ø / ± / 上下偏差，不只返回一个数字</text>
<text x="64" y="364" class="node-sub">每项携带页码、证据文本、置信度；跨页值不一致时不静默覆盖</text>
<text x="64" y="386" class="node-sub">规则复核 15P×2.00=28.00、针长尺寸链等可计算关系</text>
<g transform="translate(48 650)">
<path d="M0 8 H38" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

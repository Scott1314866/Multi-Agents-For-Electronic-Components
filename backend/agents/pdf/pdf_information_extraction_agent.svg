<path d="M145 8 H183" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<text x="193" y="12" class="legend">人工复核流</text>
<path d="M310 8 H348" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-red)"/>

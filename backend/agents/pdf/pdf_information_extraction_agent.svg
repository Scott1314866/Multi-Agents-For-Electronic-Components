<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720">
<style>
text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #6b7280; }
.node-title { font-size: 14px; font-weight: 700; }
.node-sub { font-size: 11.5px; fill: #6b7280; }
.label { font-size: 12px; font-weight: 600; }
.legend { font-size: 12px; fill: #6b7280; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
</defs>
<rect width="1400" height="720" fill="#ffffff"/>
<text x="50" y="42" class="title">PDF 信息提取助手 · Agent Graph</text>
<text x="50" y="66" class="subtitle">逐页视觉提取 + 证据归并 + 确定性尺寸校验 + 按需人工复核</text>
<rect x="24" y="88" width="1260" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6,4"/>

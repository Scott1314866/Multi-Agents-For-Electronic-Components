<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请码管理 · Component Foundry</title><link rel="stylesheet" href="/api/v1/auth/ui/assets/auth.css"><script type="module" src="/api/v1/auth/ui/assets/auth.js"></script></head>
<body><main id="invite-admin" class="admin-shell"><header><a class="brand" href="/">C / COMPONENT FOUNDRY</a><a class="text-link" href="/">返回工作台 ↗</a></header><div class="admin-heading"><p class="eyebrow">WORKSPACE ACCESS</p><h1>邀请同事加入工作区</h1><p class="muted">邀请码可限定名额和有效期；撤销后不能用于注册。</p></div><form id="invite-form"><label>用途备注<input name="label" maxlength="100" placeholder="例如：研发部第一轮试用"></label><label>可注册人数<input name="max_uses" type="number" min="1" max="100" value="1" required></label><label>有效天数<input name="expires_days" type="number" min="1" max="30" value="7" required></label><button class="primary" type="submit">生成邀请码 →</button></form><p id="message" class="message" role="alert" hidden></p><section id="new-invite" class="new-invite" hidden><h2>邀请码已生成</h2><p>请复制并发送给同事。出于安全考虑，完整邀请码只在这里显示一次。</p><label>邀请码<input id="invite-code" readonly aria-label="新生成的邀请码"></label><label>注册地址<input id="register-url" readonly aria-label="注册地址"></label><button id="copy-invite" class="secondary" type="button">复制邀请信息</button></section><div class="list-heading"><h2>最近的邀请码</h2><button id="refresh-invites" class="secondary" type="button">刷新</button></div><div id="invite-list" class="invite-list" aria-live="polite"></div></main></body></html>

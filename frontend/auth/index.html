<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · Component Foundry</title><link rel="stylesheet" href="/api/v1/auth/ui/assets/auth.css"><script type="module" src="/api/v1/auth/ui/assets/auth.js"></script></head>
<body><main class="auth-shell"><aside><a class="brand" href="/">C / COMPONENT FOUNDRY</a><div><p class="eyebrow">工程协作工作区 · 第一版</p><h1>把资料带来，<br>把工程文件带走。</h1><p class="story">从工程图与手册生成 STEP 数模、原理图符号和 PCB 封装。尺寸核对、结果复核与下载，保存在公司工作区。</p></div><p class="edition">01 / 提交资料　02 / 核对参数　03 / 下载文件</p></aside><section class="form-area"><form id="register-form"><p class="eyebrow">CREATE YOUR ACCOUNT</p><h2>加入工作区</h2><p id="registration-note" class="muted" role="status">正在读取注册配置…</p><label>用户名<input name="username" autocomplete="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]+" placeholder="3–64 位字母、数字、点、横线或下划线" required></label><label>邮箱<input name="email" type="email" autocomplete="email" maxlength="128" required></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><small>至少 12 个字符，建议使用独立的长密码。</small></label><label>再次输入密码<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label id="invite-field">邀请码<input name="invite_code" autocomplete="off" maxlength="128" required><small>请向管理员索取邀请码。</small></label><p id="message" class="message" role="alert" hidden></p><button id="register-submit" class="primary" type="submit" disabled>注册并进入工作台 <span>→</span></button><p class="muted">已有账号？<a class="text-link" href="/">返回登录</a></p><p class="workspace-note">同一邀请码加入的公司工作区共享任务与文件，请上传公司允许共享的工程资料。</p></form></section></main></body></html>
